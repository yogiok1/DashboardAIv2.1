version: '2.1'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - ./var/www/html
      - ./storage:/var/www/html
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

    environment:
    - APP_ENV=production
    - APP_DEBUG=false
    - APP_CONNETION=mysql
    - DB_HOST=db
    - DB_PORT=3306
    - DB_DATABASE=laravel
    - DB_USERNAME=root
    - DB_PASSWORD=Passwordaids2025-

    networks:
      - laravel
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mariadb:10.5
    container_name: laravel_db
    restart: unless-stopped

    environment:
      - MARIADB_DATABASE=laravel
      - MARIADB_USER=root
      - MARIADB_PASSWORD=Passwordaids2025-
      - MARIADB_ROOT_PASSWORD=Passwordaids2025-

    command:
      --default-authentication-plugin=mysql_native_password

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
    driver: local
